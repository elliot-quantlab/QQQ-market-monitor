[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qqq-market-monitor"
version = "1.0.0"
description = "Automated QQQ market briefing and rule-based risk monitoring system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3.0",
    "yfinance>=0.2.40,<1.0",
]

[project.scripts]
qqq-market-monitor = "qqq_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
